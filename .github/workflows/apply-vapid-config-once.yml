name: Apply VAPID config once

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply source patches
        run: node scripts/patch-vapid-config.mjs
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm run test
      - name: TypeScript and lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit functional VAPID integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/integrations-core.ts worker/integrations-status.ts 'src/app/admin/(painel)/integracoes/page.tsx'
          git commit -m "feat(push): gerencia e valida VAPID pelas Configurações"
          git push origin HEAD:develop
      - name: Remove one-shot patcher
        shell: bash
        run: |
          git rm .github/workflows/apply-vapid-config-once.yml scripts/patch-vapid-config.mjs
          git commit -m "chore(push): remove patcher temporário da VAPID"
          git push origin HEAD:develop
