name: CI — React + Vite + Cloudflare

on:
  push:
    branches:
      - develop
      - main
      - security/lgpd-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests + TypeScript + Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Secret scan — working tree + Git history
        run: node scripts/security-secret-scan.mjs

      - name: Full dependency audit
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm run test

      - name: TypeScript check
        run: npm run lint

      - name: Production build validation
        run: npm run build

      - name: Publish updated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-security
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
