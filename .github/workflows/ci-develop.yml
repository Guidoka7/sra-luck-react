name: CI — React + Vite + Cloudflare

on:
  push:
    branches:
      - develop
      - main
      - security/lgpd-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests + TypeScript + Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Full dependency audit report
        run: npm audit --audit-level=moderate || true

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: TypeScript check
        run: npm run lint

      - name: Production build validation
        run: npm run build
