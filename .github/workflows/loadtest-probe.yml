name: Load Test Host Probe
on:
  push:
    branches: [load-test-10k-isolated]
    paths:
      - ".github/workflows/loadtest-probe.yml"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Probe protected Vercel Preview with trusted OIDC
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set +e
          base="https://sra-luck-react-git-load-test-10k-isolated-guidoka7.vercel.app"
          for path in "/" "/api/health" "/api/ready"; do
            code=$(curl -L -sS -o /tmp/body -w "%{http_code}" --max-time 20               -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN"               -H "x-vercel-set-bypass-cookie: true"               "$base$path")
            echo "$path -> HTTP $code"
            head -c 500 /tmp/body | tr '\n' ' '; echo
          done
