<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6B1F2E" />
    <meta name="description" content="Sra. Luck — Cirurgia Programada" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/simulador-iphone.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/brand/sra-luck-mark.png" />
    <title>Sra. Luck — Cirurgia Programada</title>
    <script>
      window.__sraLuckBeforeInstallPrompt = window.__sraLuckBeforeInstallPrompt || null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__sraLuckBeforeInstallPrompt = event;
        window.dispatchEvent(new Event("sra-luck-pwa-ready"));
      });
      window.addEventListener("appinstalled", function () {
        window.__sraLuckBeforeInstallPrompt = null;
        try {
          localStorage.setItem("sra-luck-pwa-installed-v1", "true");
          localStorage.setItem("sra-luck-pwa-install-modal-v1-seen", "true");
          localStorage.setItem("sra-luck-push-after-install", "pending");
        } catch (_) {}
        window.dispatchEvent(new Event("sra-luck-pwa-installed"));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
