<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6E8E4" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Sra. Luck — Cirurgia Programada" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sra. Luck" />
    <link rel="manifest" href="/simulador-iphone.webmanifest?v=20260915-4" />
    <link rel="apple-touch-icon" href="/icons/sra-luck-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/brand/sra-luck-mark.png" />
    <title>Sra. Luck — Cirurgia Programada</title>
    <style>
      html[data-sra-client="true"],
      html[data-sra-client="true"] body,
      html[data-sra-client="true"] #root {
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        max-width: 100%;
        min-height: 100%;
        background: var(--sra-client-top, #FBF7F5) !important;
        color-scheme: light;
      }

      html[data-sra-client="true"] #root {
        min-height: 100dvh;
      }

      @media (max-width: 639px) {
        html[data-sra-client="true"],
        html[data-sra-client="true"] body,
        html[data-sra-client="true"] #root,
        html[data-sra-client="true"] body .client-app {
          width: 100vw !important;
          max-width: 100vw !important;
          min-width: 100vw !important;
          margin: 0 !important;
          padding-left: 0 !important;
          padding-right: 0 !important;
          overflow-x: hidden !important;
        }

        html[data-sra-client="true"] body .client-app {
          min-height: 100dvh !important;
          padding-top: 0 !important;
          padding-bottom: 0 !important;
          background: #FBF7F5 !important;
        }

        html[data-sra-client="true"] body .client-app .mobile-app-frame {
          width: 100vw !important;
          max-width: 100vw !important;
          min-width: 100vw !important;
          min-height: 100dvh !important;
          margin: 0 !important;
          box-shadow: none !important;
        }

        html[data-sra-client="true"] body .client-app .sl-bottom-nav {
          left: 0 !important;
          width: 100vw !important;
          max-width: 100vw !important;
          transform: none !important;
        }
      }
    </style>
    <script>
      (function () {
        var HOME_TOP = "#F6E8E4";
        var DEFAULT_TOP = "#FBF7F5";
        var CLIENT_PATHS = ["/login", "/agenda", "/app", "/cliente", "/agenda-legado"];
        var observer = null;

        function isClientPath() {
          return CLIENT_PATHS.indexOf(window.location.pathname) !== -1;
        }

        function resolveTopColor() {
          if (window.location.pathname === "/login") return DEFAULT_TOP;
          var root = document.getElementById("root");
          if (root && root.querySelector(".sl-home-header")) return HOME_TOP;
          if (root && root.querySelector(".sl-tab")) return DEFAULT_TOP;
          return HOME_TOP;
        }

        function syncClientChrome() {
          var client = isClientPath();
          if (client) document.documentElement.setAttribute("data-sra-client", "true");
          else document.documentElement.removeAttribute("data-sra-client");

          if (!client) return;

          var color = resolveTopColor();
          document.documentElement.style.setProperty("--sra-client-top", color);
          document.documentElement.style.backgroundColor = color;

          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute("content", color);

          if (document.body) {
            document.body.style.margin = "0";
            document.body.style.backgroundColor = color;
          }

          var root = document.getElementById("root");
          if (root) root.style.backgroundColor = color;
        }

        function observeClientUi() {
          var root = document.getElementById("root");
          if (!root || observer) return;
          observer = new MutationObserver(function () {
            window.requestAnimationFrame(syncClientChrome);
          });
          observer.observe(root, { childList: true, subtree: true });
        }

        syncClientChrome();
        document.addEventListener("DOMContentLoaded", function () {
          syncClientChrome();
          observeClientUi();
        });
        window.addEventListener("pageshow", syncClientChrome);
        window.addEventListener("app:navigate", function () {
          syncClientChrome();
          observeClientUi();
        });
        window.addEventListener("focus", syncClientChrome);
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) syncClientChrome();
        });
      })();

      window.__sraLuckBeforeInstallPrompt = window.__sraLuckBeforeInstallPrompt || null;

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__sraLuckBeforeInstallPrompt = event;
        window.dispatchEvent(new Event("sra-luck-pwa-ready"));
      });

      window.addEventListener("appinstalled", function () {
        window.__sraLuckBeforeInstallPrompt = null;
        try {
          localStorage.setItem("sra-luck-pwa-installed-v2", "true");
          localStorage.setItem("sra-luck-push-after-install", "pending");
          localStorage.removeItem("sra-luck-pwa-install-dismissed-date-v3");
        } catch (_) {}
        window.dispatchEvent(new Event("sra-luck-pwa-installed"));
      });

      // Registra cedo para que o Chromium avalie a instalabilidade mesmo quando
      // /login -> /agenda acontece dentro da SPA sem um novo carregamento.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/simulador-iphone-sw.js", { scope: "/", updateViaCache: "none" })
            .then(function (registration) {
              return registration.update().catch(function () {});
            })
            .catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
